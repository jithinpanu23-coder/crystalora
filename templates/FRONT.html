{% load static %}

<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>CRYSTALORA</title>

    <!-- BOOTSTRAP -->

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

    <style>

        *{
            margin:0;
            padding:0;
            box-sizing:border-box;
            font-family:Segoe UI;
        }

        body{
            background:linear-gradient(135deg,#0f0f0f,#1c1c1c);
            color:white;
            overflow-x:hidden;
        }

        /* HEADER */

        .header{
            height:80px;
            border-bottom:1px solid gold;
            display:flex;
            justify-content:center;
            align-items:center;
            position:relative;
            background:#111;
        }

        .logo{
            position:absolute;
            left:20px;
        }

        .logo img{
            width:55px;
            height:55px;
            object-fit:contain;
        }

        .header h1{
            color:gold;
            letter-spacing:3px;
            font-size:32px;
            margin:0;
        }

        /* SIDEBAR */

        .sidebar{
            background:#111;
            min-height:100vh;
            padding:20px;
            border-right:1px solid #333;
        }

        .sidebar h2{
            color:gold;
            margin-bottom:25px;
            font-size:28px;
        }

        .sidebar ul{
            list-style:none;
            padding-left:0;
        }

        .sidebar ul li{
            margin-bottom:15px;
        }

        .sidebar ul li a{
            color:white;
            text-decoration:none;
            padding:12px;
            display:block;
            border-radius:10px;
            transition:0.3s;
            font-size:18px;
        }

        .sidebar ul li a:hover{
            background:gold;
            color:black;
        }

        /* CONTENT */

        .content{
            padding:30px;
        }

        /* PRODUCT CARD */

        .card{
            background:#1a1a1a;
            border-radius:15px;
            overflow:hidden;
            transition:0.3s;
            border:1px solid #333;
            height:100%;
        }

        .card:hover{
            transform:translateY(-8px);
            border-color:gold;
            box-shadow:0 0 12px rgba(255,215,0,0.2);
        }

        /* IMAGE BOX */

        .image-box{
            overflow:hidden;
        }

        /* PRODUCT IMAGE */

        .image-box img{
            width:100%;
            height:260px;
            object-fit:cover;
            transition:0.5s ease;
        }

        /* IMAGE ZOOM EFFECT */

        .card:hover .image-box img{
            transform:scale(1.1);
        }

        /* PRODUCT INFO */

        .product-info{
            padding:15px;
        }

        .product-info h3{
            color:gold;
            margin-bottom:10px;
            font-size:24px;
        }

        .description{
            color:#ccc;
            margin-bottom:10px;
            font-size:15px;
        }

        .price{
            color:gold;
            font-size:22px;
            font-weight:bold;
        }

        /* WHATSAPP BUTTON */

        .whatsapp-btn{
            display:block;
            width:100%;
            text-align:center;
            background:#25D366;
            color:white;
            padding:12px;
            border-radius:10px;
            text-decoration:none;
            font-weight:bold;
            margin-top:15px;
            transition:0.3s;
        }

        .whatsapp-btn:hover{
            background:#1ebe5d;
            color:white;
        }

        /* MOBILE */

        @media(max-width:768px){

            .header{
                height:70px;
            }

            .header h1{
                font-size:18px;
                letter-spacing:1px;
            }

            .logo img{
                width:40px;
                height:40px;
            }

            .sidebar{
                min-height:auto;
                border-right:none;
                border-bottom:1px solid #333;
            }

            .sidebar h2{
                font-size:22px;
            }

            .sidebar ul li a{
                font-size:16px;
                padding:10px;
            }

            .content{
                padding:15px;
            }

            .image-box img{
                height:220px;
            }

        }

    </style>

</head>

<body>

    <!-- HEADER -->

    <div class="header">

        <div class="logo">

            <img src="{% static 'image/logo.png' %}" alt="logo">

        </div>

        <h1>CRYSTALORA COLLECTION</h1>

    </div>

    <!-- MAIN -->

    <div class="container-fluid">

        <div class="row">

            <!-- SIDEBAR -->

            <div class="col-lg-2 col-md-3 sidebar">

                <h2>Categories</h2>

                <ul>

                    <li>
                        <a href="{% url 'front' %}">
                            All Products
                        </a>
                    </li>

                    {% for c in categories %}

                    <li>
                        <a href="?category={{ c.id }}">
                            {{ c.name }}
                        </a>
                    </li>

                    {% endfor %}

                </ul>

            </div>

            <!-- PRODUCTS -->

            <div class="col-lg-10 col-md-9 content">

                <div class="row g-4">

                    {% for p in products %}

                    <div class="col-lg-4 col-md-6 col-sm-12">

                        <div class="card">

                            <!-- IMAGE -->

                            <div class="image-box">

                                <img src="{{ p.image.url }}" alt="{{ p.name }}">

                            </div>

                            <!-- INFO -->

                            <div class="product-info">

                                <h3>{{ p.name }}</h3>

                                <p class="description">
                                    {{ p.description }}
                                </p>

                                <p class="price">
                                    ₹{{ p.price }}
                                </p>

                                <!-- WHATSAPP BUTTON -->

                                <a

                                href="https://wa.me/916235652968?text=Hello%20I%20want%20to%20order%20{{ p.name }}%20for%20₹{{ p.price }}"

                                target="_blank"

                                class="whatsapp-btn">

                                    Order on WhatsApp

                                </a>

                            </div>

                        </div>

                    </div>

                    {% endfor %}

                </div>

            </div>

        </div>

    </div>

    <!-- BOOTSTRAP JS -->

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

</body>

</html>
