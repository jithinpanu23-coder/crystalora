<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Contact Us</title>

<style>
    * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
        font-family: 'Segoe UI', sans-serif;
    }

    body {
        background: linear-gradient(135deg, #0f2027, #203a43, #2c5364);
        color: #fff;
    }

    .contact-container {
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 40px;
    }

    .contact-box {
        max-width: 1000px;
        width: 100%;
        background: rgba(255,255,255,0.05);
        backdrop-filter: blur(15px);
        border-radius: 20px;
        padding: 50px;
        box-shadow: 0 8px 40px rgba(0,0,0,0.4);
        text-align: center;
    }

    .contact-box h1 {
        font-size: 40px;
        margin-bottom: 10px;
        background: linear-gradient(90deg, #f5af19, #f12711);
        -webkit-background-clip: text;
        -webkit-text-fill-color: transparent;
    }

    .contact-box p {
        color: #ccc;
        margin-bottom: 40px;
    }

    .contact-info {
        display: flex;
        flex-direction: column;
        gap: 20px;
        margin-bottom: 40px;
    }

    .info-card {
        background: rgba(255,255,255,0.08);
        padding: 20px;
        border-radius: 15px;
        transition: 0.3s;
    }

    .info-card:hover {
        transform: translateY(-5px);
        background: rgba(255,255,255,0.15);
    }

    .info-card h3 {
        color: #f5af19;
        margin-bottom: 5px;
    }

    /* BACK BUTTON */
    .btn {
        display: inline-block;
        padding: 12px 30px;
        border-radius: 25px;
        border: none;
        background: linear-gradient(90deg, #f5af19, #f12711);
        color: #fff;
        font-weight: bold;
        text-decoration: none;
        transition: 0.3s;
    }

    .btn:hover {
        opacity: 0.85;
        transform: scale(1.05);
    }
</style>
</head>

<body>

<div class="contact-container">
    <div class="contact-box">

        <h1>Contact Us</h1>
        <p>We’d love to hear from you. Reach out anytime 💬</p>

        <!-- Contact Info -->
        <div class="contact-info">
            <div class="info-card">
                <h3>📍 Location</h3>
                <p>PATHANAMTHITTA , KERALA</p>
            </div>

            <div class="info-card">
                <h3>📞 Phone</h3>
                <p>+91 6235652968</p>
            </div>

            <div class="info-card">
                <h3>✉ Email</h3>
                <p>crystalora25@gmail.com</p>
            </div>
        </div>

        <!-- BACK BUTTON -->
        <a href="{% url 'home' %}" class="btn">⬅ BACK </a>

    </div>
</div>

</body>
</html>
