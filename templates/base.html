<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>CrystalOra</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <style>
        /* Reset */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', sans-serif;
        }

        body {
            background: #0f0f0f;
            color: white;
        }

        /* ================= HEADER ================= */
        .header {
            position: fixed;
            top: 0;
            width: 100%;
            height: 70px;
            background: rgba(15, 15, 15, 0.95);
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 30px;
            z-index: 1000;
            border-bottom: 1px solid gold;
            backdrop-filter: blur(6px);
        }

        /* Logo */
        .logo {
            font-size: 30px;
            color: gold;
            cursor: pointer;
        }

        /* Company Name Center */
        .company-name {
            position: absolute;
            left: 50%;
            transform: translateX(-50%);
            font-size: 24px;
            color: gold;
            font-weight: bold;
            letter-spacing: 1px;
        }

        /* Right Section */
        .nav-right {
            display: flex;
            align-items: center;
            gap: 15px;
        }

        /* Contact Button */
        .nav-btn {
            text-decoration: none;
            color: gold;
            border: 1px solid gold;
            padding: 7px 18px;
            border-radius: 25px;
            transition: 0.3s;
            font-size: 14px;
        }

        .nav-btn:hover {
            background: gold;
            color: black;
        }

        /* ================= PAGE CONTENT ================= */
        .main-content {
            margin-top: 90px; /* Prevent overlap with fixed header */
            padding: 40px;
            text-align: center;
        }

        .main-content h1 {
            color: gold;
            margin-bottom: 20px;
        }

        .card {
            background: #1a1a1a;
            padding: 25px;
            border-radius: 15px;
            margin: 20px auto;
            max-width: 400px;
            border: 1px solid #333;
            transition: 0.3s;
        }

        .card:hover {
            transform: translateY(-5px);
            border-color: gold;
        }

        /* ================= RESPONSIVE ================= */
        @media (max-width: 768px) {
            .company-name {
                font-size: 18px;
            }

            .logo {
                font-size: 24px;
            }

            .nav-btn {
                padding: 5px 12px;
                font-size: 12px;
            }

            .main-content {
                padding: 20px;
            }
        }

    </style>
</head>

<body>

    <!-- HEADER -->
    <header class="header">
        <div class="logo">💎</div>

        <div class="company-name">CrystalOra</div>

        <div class="nav-right">
            <a href="#" class="nav-btn">Contact</a>
        </div>
    </header>

    <!-- MAIN CONTENT -->
    <div class="main-content">
        <h1>Product Details</h1>

        <div class="card">
            <h2>Gold Necklace</h2>
            <p>Weight: 25g</p>
            <p>Price: ₹1,50,000</p>
        </div>

        <div class="card">
            <h2>Gold Ring</h2>
            <p>Weight: 5g</p>
            <p>Price: ₹30,000</p>
        </div>

    </div>

</body>
</html>
