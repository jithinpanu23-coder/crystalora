<!DOCTYPE html>
<html lang="en">
<head>
    {% load static %}
    <meta charset="UTF-8">
    <title>CRYSTALORA</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <style>
        /* ===== RESET ===== */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', sans-serif;
        }

        body {
            background: linear-gradient(135deg, #0f0f0f, #1c1c1c);
            color: white;
        }

        /* ===== NAVBAR ===== */
        .navbar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 20px 50px;
        }

        .logo {
            display: flex;
            align-items: center;
            gap: 10px;
            font-size: 26px;
            font-weight: bold;
            color: gold;
        }

        .logo img {
            width: 60px;
            height: 55px;
            object-fit: contain;
        }

        /* ===== NAV BUTTONS (REWORKED SAME THEME) ===== */
        .nav-right {
            display: flex;
            gap: 18px;
        }

        .nav-btn {
            padding: 10px 26px;
            border-radius: 30px;
            text-decoration: none;
            font-weight: 600;
            letter-spacing: 0.5px;

            color: gold;
            background: transparent;
            border: 1.8px solid gold;

            transition: all 0.3s ease;

            /* subtle glow */
            box-shadow: 0 0 0 rgba(255, 215, 0, 0);
        }

        /* Hover effect */
        .nav-btn:hover {
            background: gold;
            color: black;

            transform: translateY(-2px) scale(1.05);

            /* glowing effect */
            box-shadow: 0 0 12px rgba(255, 215, 0, 0.6),
                        0 0 25px rgba(255, 215, 0, 0.3);
        }

        /* Click effect */
        .nav-btn:active {
            transform: scale(0.95);
            box-shadow: 0 0 8px rgba(255, 215, 0, 0.5);
        }

        /* ===== HERO SECTION ===== */
        .hero {
            height: 85vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            text-align: center;
        }

        .hero-logo {
            width: 250px;
            height: 200px;
            margin-bottom: 15px;
        }

        .hero h2 {
            font-size: 52px;
            color: gold;
            margin-bottom: 20px;
            letter-spacing: 1px;
        }

        .hero p {
            font-size: 18px;
            color: #ccc;
            margin-bottom: 35px;
            max-width: 600px;
        }

        .start-btn {
            padding: 14px 35px;
            font-size: 16px;
            border: none;
            background: gold;
            color: black;
            border-radius: 30px;
            cursor: pointer;
            font-weight: bold;
            transition: all 0.3s ease;
        }

        .start-btn:hover {
            background: #e6c200;
            transform: scale(1.08);
        }

        /* ===== RESPONSIVE ===== */
        @media (max-width: 768px) {
            .navbar {
                padding: 15px 20px;
            }

            .logo {
                font-size: 20px;
            }

            .logo img {
                width: 28px;
                height: 28px;
            }

            .hero h2 {
                font-size: 34px;
            }

            .hero-logo {
                width: 120px;
            }

            .hero p {
                letter-spacing: 2px;
                word-spacing: 6px;
            }

            .nav-btn {
                padding: 6px 14px;
                font-size: 12px;
            }
        }
    </style>
</head>

<body>

    <!-- NAVBAR -->
    <div class="navbar">
        <div class="logo">
            <img src="{% static' image/logo.png' %}" alt="logo">
            CRYSTALORA
        </div>

        <div class="nav-right">
            <a href="{% url 'about'%}" class="nav-btn">About</a>
            <a href="{% url 'contact'%}" class="nav-btn">Contact</a>
        </div>
    </div>

    <!-- HERO SECTION -->
    <div class="hero">
        <img src="{% static 'image/logo.png' %}" alt="logo" class="hero-logo">

        <h2>CRYSTALORA</h2>
        <p>ILLUMINATE YOUR ESSENCE</p>

       <a href="FRONT"> <button class="start-btn" onclick="location.href='FRONT.html'">
    Get Started
</button>
       </a>
    </div>

</body>
</html>
